<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ODIN 3D Studio – Animation Lab</title>
<style>
:root{color-scheme:dark;--bg:#0b111a;--ink:#ecf0f6;--sub:#a5b3c5;--gold:#f5c569}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font-family:system-ui,Segoe UI,sans-serif;color:var(--ink)}
#layout{min-height:100dvh;display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr)}
aside{background:#121c2a;border-right:1px solid #27374c;padding:24px;display:flex;flex-direction:column;gap:17px;z-index:2}h1{margin:0;font-size:24px;letter-spacing:.1em}h1 span{color:var(--gold)}.muted{color:var(--sub);font-size:13px;line-height:1.5}label{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
button,select,input[type=file]::file-selector-button{border:1px solid #34475d;background:#1c2b3e;color:var(--ink);padding:11px 12px;border-radius:10px;cursor:pointer;font:inherit}button:hover{border-color:var(--gold)}select,input{width:100%}input[type=range]{accent-color:var(--gold)}.file{background:#1b293a;padding:14px;border:1px dashed #657587;border-radius:14px}.file input{font-size:12px;color:var(--sub)}.buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.buttons button{font-size:13px}
#viewport{min-height:100dvh;position:relative;overflow:hidden}#canvas{display:block;width:100%;height:100%}#status{position:absolute;top:20px;left:20px;right:20px;pointer-events:none;font-size:13px;background:#131e2bcc;border:1px solid #2c3c4b;padding:12px;border-radius:10px;max-width:430px}#hint{position:absolute;bottom:18px;left:18px;color:#d2dce9a3;font-size:12px;pointer-events:none}hr{width:100%;border:0;border-top:1px solid #2e3d50}
@media(max-width:800px){#layout{display:flex;flex-direction:column}aside{padding:15px;gap:10px}#viewport{height:65dvh;min-height:380px}h1{font-size:20px}.buttons{grid-template-columns:repeat(4,minmax(0,1fr))}.buttons button{padding:8px 4px;font-size:11px}}
</style>
</head><body><div id="layout"><aside>
<div><h1><span>ᚨ</span> ODIN 3D STUDIO</h1><div class="muted">CHARACTER & ANIMATION LAB · V1</div></div>
<div class="file"><label for="glb">GLB-Modell auswählen</label><p class="muted">Lade die GLB-Datei aus einem GitHub-Actions-Artifact. Die Datei bleibt lokal in deinem Browser.</p><input id="glb" type="file" accept=".glb,model/gltf-binary"></div>
<div><label for="animations">Animation</label><select id="animations" disabled><option>Erst Modell laden</option></select></div>
<div><label for="speed">Geschwindigkeit: <strong id="speedValue">1.0×</strong></label><input id="speed" type="range" min="0" max="2" step="0.1" value="1"></div>
<div><label>Kamera</label><div class="buttons"><button data-view="front">Vorne</button><button data-view="side">Seite</button><button data-view="back">Hinten</button><button data-view="iso">3/4</button></div></div>
<div><button id="pause" style="width:100%">Animation pausieren</button></div><hr>
<div class="muted" id="details">Drehen: Mausziehen oder Fingerbewegung. Zoomen: Mausrad oder zwei Finger.</div>
</aside><main id="viewport"><canvas id="canvas"></canvas><div id="status" role="status">Bereit. Wähle eine GLB-Datei aus.</div><div id="hint">ODIN GAME STUDIO · Three.js Viewer</div></main></div>
<script type="module" src="./viewer.bundle.js"></script></body></html>
