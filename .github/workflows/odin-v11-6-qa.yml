name: ODIN V11.6 Nightly Original QA
on:
  push:
    branches: ["odin/private-markets-tycoon-nightly"]
    paths:
      - "nightly/v11-original/v11_6/**"
      - ".github/workflows/odin-v11-6-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odin-v11-6-nightly
  cancel-in-progress: false
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble standalone original V11.6
        run: python nightly/v11-original/v11_6/assemble.py
      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("nightly/v11-original/PrivateMarketsTycoon_V11_6_Nightly_Offline.html").read_text("utf-8")
          Path("/tmp/odin-v11-6.js").write_text(s.split("<script>",1)[1].rsplit("</script>",1)[0],encoding="utf-8")
          PY
          node --check /tmp/odin-v11-6.js
      - name: Install browser
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run mobile and desktop gameplay
        run: python nightly/v11-original/v11_6/qa_smoke.py
      - name: Upload playable HTML and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PrivateMarketsTycoon-V11-5-Nightly-Offline
          path: |
            nightly/v11-original/PrivateMarketsTycoon_V11_6_Nightly_Offline.html
            nightly/v11-original/v11_6/screenshots/
          retention-days: 30
