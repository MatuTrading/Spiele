name: ODIN Blender Asset Pipeline
on:
  push:
    branches: [odin/blender-pipeline]
    paths:
      - 'odin-3d-studio/**'
      - '.github/workflows/odin-blender.yml'
  workflow_dispatch:
    inputs:
      job:
        description: 'Whitelisted job manifest'
        type: choice
        options:
          - example_character.json
          - example_world.json
        required: true
        default: example_character.json
permissions:
  contents: read
concurrency:
  group: odin-blender-${{ github.sha }}
  cancel-in-progress: false
jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        job: [example_character.json, example_world.json]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Install Blender (Ubuntu repositories)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --version | head -n 3
          blender --background --factory-startup --python-expr "import numpy; print('ODIN dependency check - numpy', numpy.__version__)"
      - name: Generate character, animation clips, GLB and preview renders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          JOB="${{ matrix.job }}"
          if [ -z "$JOB" ]; then JOB='example_character.json'; fi
          case "$JOB" in
            example_character.json|example_world.json) ;;
            *) echo 'Unexpected job input' >&2; exit 1 ;;
          esac
          blender --background --factory-startup --python odin-3d-studio/scripts/build_asset.py -- --job "odin-3d-studio/jobs/$JOB" --output output 2>&1 | tee output/blender.log
      - name: Validate binary GLB and render evidence
        run: |
          python3 odin-3d-studio/scripts/validate_assets.py --output output --job "odin-3d-studio/jobs/${{ matrix.job }}"
      - name: Bundle portable Three.js animation viewer
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix odin-3d-studio/viewer --no-audit --no-fund
          mkdir -p output/viewer
          odin-3d-studio/viewer/node_modules/.bin/esbuild odin-3d-studio/viewer/app.js --bundle --minify --format=esm --outfile=output/viewer/viewer.bundle.js
          cp odin-3d-studio/viewer/index.html output/viewer/index.html
          MODEL_FILE="$(find output -maxdepth 1 -name '*.glb' -printf '%f\n' | head -n1)"
          test -n "$MODEL_FILE"
          cp "output/$MODEL_FILE" output/viewer/
          python3 -c 'import json,sys;print(json.dumps({"model":sys.argv[1]}))' "$MODEL_FILE" > output/viewer/asset-manifest.json
          node --check output/viewer/viewer.bundle.js
      - name: Upload generated files and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odin-blender-${{ matrix.job }}-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
