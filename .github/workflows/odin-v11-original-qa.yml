name: ODIN V11 original-based Nightly QA
on:
  push:
    branches: ["odin/private-markets-tycoon-nightly"]
    paths:
      - "nightly/v11-original/**"
      - ".github/workflows/odin-v11-original-qa.yml"
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nightly/v11-original/assemble.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("nightly/v11-original/PrivateMarketsTycoon_V11_3_Nightly_Offline.html")
          s=p.read_text("utf-8")
          Path("/tmp/odin-game.js").write_text(s.split("<script>",1)[1].rsplit("</script>",1)[0],encoding="utf-8")
          PY
          node --check /tmp/odin-game.js
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python nightly/v11-original/qa_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PrivateMarketsTycoon-V11-3-Nightly-Offline
          path: |
            nightly/v11-original/PrivateMarketsTycoon_V11_3_Nightly_Offline.html
            nightly/v11-original/screenshots/
          retention-days: 30
