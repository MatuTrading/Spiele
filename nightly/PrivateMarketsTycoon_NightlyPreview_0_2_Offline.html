const PAGES=[['overview','◈','Übersicht'],['market','▥','Börse'],['private','◆','Private Markets'],['company','♜','Unternehmen'],['funds','▣','Eigene Fonds'],['journal','◷','Chronik & Hilfe']];
try{let stored=localStorage.getItem(KEY);s=stored?validate(JSON.parse(stored)):initialState();}catch(e){saveError=e.message;s=initialState();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){console.warn('Autosave fehlgeschlagen',e);showToast('Speichern derzeit nicht möglich. Bitte exportiere deinen Spielstand.',true);}}
function tone(){if(!sound)return;try{let ctx=new(window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=520;g.gain.value=.02;o.start();o.stop(ctx.currentTime+.08);o.onended=()=>ctx.close();}catch{}}
function showToast(msg,error=false){let e=document.createElement('div');e.className='toast'+(error?' error':'');e.textContent=msg;$('toastStack').append(e);setTimeout(()=>e.remove(),4400);tone();}
function run(fn){try{let result=fn();save();render();return result;}catch(e){showToast(e.message||'Aktion fehlgeschlagen',true);return null;}}
function nav(target){screen=target;modal=null;render();$('screen').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function mkbutton(label,action,extra='',klass='btn'){return `<button class="${klass}" data-action="${action}" ${extra}>${label}</button>`;}
const changePct=(a,b)=>a>0?(b/a-1)*100:0;
function signed(x,unit='%'){return `<span class="${x>=0?'positive':'negative'} mono">${x>=0?'+':''}${x.toLocaleString('de-DE',{maximumFractionDigits:1})}${unit}</span>`;}
function title(eyebrow,main,subtitle='',right=''){return `<div class="page-header"><div><div class="page-eyebrow">${eyebrow}</div><h1 class="page-title">${main}</h1>${subtitle?`<p class="subtext">${subtitle}</p>`:''}</div>${right}</div>`;}
function navBar(){
  const short={overview:'Start',market:'Börse',private:'Deals',company:'Team',funds:'Fonds',journal:'Chronik'};
  $('navigation').innerHTML=PAGES.map(([id,icon,name])=>`<button class="navbtn ${screen===id?'active':''}" ${screen===id?'aria-current="page"':''} data-action="navigate" data-id="${id}" title="${esc(name)}"><span class="nav-icon">${icon}</span><span class="nav-text">${name}</span></button>`).join('');
  $('mobileNavigation').innerHTML=PAGES.map(([id,icon,name])=>`<button class="${screen===id?'active':''}" ${screen===id?'aria-current="page"':''} aria-label="${esc(name)}" data-action="navigate" data-id="${id}"><span aria-hidden="true">${icon}</span>${short[id]}</button>`).join('')+'<button aria-label="Spielstand und Einstellungen" data-action="settings" title="Spielstand und Einstellungen"><span aria-hidden="true">⚙</span>Menü</button>';
}
function header(){ $('companyBrand').textContent=s.company.toUpperCase();$('cashStat').textContent=money(s.cash,true);$('cashStat').classList.toggle('red',s.cash<15000);$('wealthStat').textContent=money(wealth(s),true);$('repStat').textContent=`${s.reputation} / 100`;$('dateStat').textContent=getMonthText(s.month);document.querySelectorAll('.speed').forEach(e=>e.classList.toggle('active',+e.dataset.speed===speed));}
function chart(points,w=660,h=190,color='#7ee6c4'){if(!points.length)points=[0,1];if(points.length===1)points=[points[0],points[0]];let min=Math.min(...points),max=Math.max(...points);if(min===max){min*=.95;max*=1.05;}let pad=8,coords=points.map((v,i)=>[pad+i*(w-pad*2)/(points.length-1||1),pad+(max-v)/(max-min)*(h-pad*2)]);let path=coords.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' ');let area=path+` L ${w-pad} ${h} L ${pad} ${h} Z`;
return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Wertverlauf, letzter Wert ${Math.round(points.at(-1))}"><defs><linearGradient id="fill-${Math.round(max)}-${Math.round(min)}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${color}" stop-opacity=".26"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${[.25,.5,.75].map(v=>`<line x1="0" x2="${w}" y1="${h*v}" y2="${h*v}" stroke="#547183" stroke-dasharray="4 5" stroke-opacity=".45"/>`).join('')}<path d="${area}" fill="url(#fill-${Math.round(max)}-${Math.round(min)})"/><path d="${path}" fill="none" stroke="${color}" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function recentEvents(n=4){return `<div class="event-list">${s.events.slice(0,n).map(e=>`<div class="event ${e.type}"><div class="event-title"><span>${esc(e.title)}</span><small>${getMonthText(e.month)}</small></div><p>${esc(e.detail)}</p></div>`).join('')}</div>`;}
function milestones(){let steps=[['firstTrade','Erste Aktie handeln','Kaufe deine erste Aktie'],['firstDD','Deal prüfen','Führe eine Due Diligence durch'],['firstDeal','Private Markets erobern','Schließe dein erstes Investment ab'],['firstHire','Team aufbauen','Stelle einen Mitarbeiter ein'],['firstUpgrade','Büro ausbauen','Wechsle in eine Investmentboutique'],['firstFund','Fonds auflegen','Starte deinen ersten Anlegerfonds'],['million','Millionen-Imperium','Erreiche 1.000.000 € Eigenvermögen']];return `<div>${steps.map(([key,label,desc])=>`<div class="goal ${s.flags[key]?'done':''}"><i>${s.flags[key]?'✓':'○'}</i><p>${label}<br><small>${desc}</small></p></div>`).join('')}</div>`;}
function tutorial(){let key,step,body,target,label;if(!s.flags.firstTrade){key='firstTrade';step='01';body='Wähle an der Börse ein Unternehmen und kaufe deine ersten Aktien.';target='market';label='Zur Börse';}else if(!s.flags.firstDeal){key='firstDeal';step='02';body='Prüfe einen Private-Markets-Deal und schließe dein erstes Investment ab.';target='private';label='Deals prüfen';}else if(!s.flags.firstHire){key='firstHire';step='03';body='Stelle einen Investmentmanager ein und baue dein Unternehmen aus.';target='company';label='Team aufbauen';}else return '';if(screen!=='overview'&&screen!==target)return '';return `<div class="tutorial-bar"><div><strong>◆ DEIN EINSTIEG · SCHRITT ${step} VON 03</strong><p>${body}</p></div>${mkbutton(label+' ↗','navigate',`data-id="${target}"`,'btn small gold-btn')}</div>`;}

function gameCoach(){
  if(!s.started)return '';
  let task;
  if(s.stats.trades===0)task={id:'market',icon:'📈',title:'Dein erster Börsencoup',text:'Kaufe ein paar Aktien und lass dein Kapital für dich arbeiten.',cta:'Zur Börse'};
  else if(s.stats.dd===0)task={id:'private',icon:'🔍',title:'Augen auf beim ersten Deal',text:'Prüfe Risiken und Chancen per Due Diligence, bevor du dein Imperium erweiterst.',cta:'Deal prüfen'};
  else if(s.deals.length===0)task={id:'private',icon:'💎',title:'Jetzt wird es privat',text:'Suche dir eine passende Beteiligung oder ein attraktives Kredit- oder Infrastrukturprojekt.',cta:'Deals ansehen'};
  else if(s.staff.length===0)task={id:'company',icon:'🧑‍💼',title:'Du brauchst Verstärkung',text:'Spezialisten verbessern deine Investmententscheidungen – kosten aber Gehalt.',cta:'Team aufbauen'};
  else if(s.cash<20000)task={id:'market',icon:'⚠️',title:'Liquidität ist König',text:'Achte auf Gehälter, Kapitalabrufe und Reserven. Halte einen Sicherheitspuffer.',cta:'Portfolio prüfen'};
  else if(s.funds.length===0)task={id:'company',icon:'🏛️',title:'Auf dem Weg zum Fondsmanager',text:'Verbessere Büro, Team und Ruf, um eigene Fonds für Investoren zu starten.',cta:'Expansion planen'};
  else task={id:'journal',icon:'🏆',title:'Dein Imperium nimmt Fahrt auf',text:'Verfolge Marktphasen und Meilensteine. Jeder Monat bringt neue Chancen.',cta:'Chronik öffnen'};
  return `<section class="nightly-coach" aria-label="Nächste Mission"><div class="coach-icon" aria-hidden="true">${task.icon}</div><div class="coach-copy"><span class="coach-eyebrow">DEINE NÄCHSTE MISSION · NIGHTLY PREVIEW</span><strong>${esc(task.title)}</strong><p>${esc(task.text)}</p></div>${mkbutton(esc(task.cta)+' →','navigate','data-id="'+task.id+'"','btn small gold-btn coach-action')}</section>`;
}

function overview(){let net=wealth(s),growth=changePct(250000,net),nStaff=s.staff.length;let level=OFFICE_UPGRADES[s.office].name;return title('KAPITAL, ENTSCHEIDUNGEN, IMPERIUM','Dein Weg an die Spitze',`Baue ${esc(s.company)} vom kleinen Investmenthaus zum Finanzimperium.`,mkbutton('⚙ Spielstand','settings'))+(tutorial()||gameCoach())+`<div class="dashboard-grid"><div class="panel office-panel"><div class="office-stage"><canvas id="officeCanvas" role="img" aria-label="Isometrisches Büro mit animierter blonder Hauptfigur, ${esc(level)}"></canvas><div class="office-overlay"><span class="office-label">◈ ${esc(level.toUpperCase())}</span><span class="office-label">● LIVE-SIMULATION</span></div><div class="stage-actions">${mkbutton('▥ Börsenterminal','navigate','data-id="market"','btn small')}${mkbutton('◆ Deal-Room','navigate','data-id="private"','btn small')}</div></div><div class="stage-footer"><div><strong>${esc(s.company)}</strong><div class="mini">${nStaff} Mitarbeitende · ${s.deals.length} Direktinvestments · ${s.funds.length} Fonds</div></div>${mkbutton('Büro gestalten & ausbauen ↗','navigate','data-id="company"','btn small gold-btn')}</div></div><div class="panel pad"><div class="section-head"><h2 class="section-title">Deine Bilanz</h2><span class="pill green">EIGENVERMÖGEN</span></div><div class="kpi-stack"><div class="kpi"><small>VERMÖGEN</small><b>${money(net,true)}</b><span>${signed(growth)} seit Gründung</span></div><div class="kpi"><small>AKTIENDEPOT</small><b>${money(holdingsValue(s),true)}</b><span>${Object.values(s.stock).filter(x=>x.shares).length} Positionen</span></div><div class="kpi"><small>PRIVATE MARKETS</small><b>${money(s.deals.reduce((n,d)=>n+d.value,0),true)}</b><span>${money(owedCapital(s),true)} offene Zusagen</span></div><div class="kpi"><small>FONDSVOLUMEN</small><b>${money(s.funds.reduce((n,f)=>n+fundNav(f),0),true)}</b><span>Nicht Teil deines Vermögens</span></div></div><div class="space"></div><div class="section-head"><h2 class="section-title">Vermögensentwicklung</h2><span class="mini">${s.history.length} Monate</span></div>${chart(s.history.map(x=>x.net),620,130)}<div class="chart-axis"><span>START</span><span>${getMonthText(s.month)}</span></div></div></div>
<div class="dashboard-bottom"><section class="panel pad"><div class="section-head"><h2 class="section-title">Deine nächsten Schritte</h2><span class="pill">MISSIONEN</span></div><div class="action-list">${!s.flags.firstTrade?`<div class="action-item"><span class="action-icon">▥</span><div class="action-copy"><strong>Starte an der Börse</strong><small>Kaufe deine erste Aktie – +8 Reputation</small></div>${mkbutton('Handeln','navigate','data-id="market"','btn small')}</div>`:''}${!s.flags.firstDeal?`<div class="action-item"><span class="action-icon">◆</span><div class="action-copy"><strong>Entdecke private Deals</strong><small>Analysiere und finanziere ein Projekt</small></div>${mkbutton('Ansehen','navigate','data-id="private"','btn small')}</div>`:''}<div class="action-item"><span class="action-icon">♜</span><div class="action-copy"><strong>Erweitere dein Unternehmen</strong><small>${nStaff} Mitarbeitende · laufende Kosten ${money(staffCost(s))}/Monat</small></div>${mkbutton('Team','navigate','data-id="company"','btn small')}</div><div class="action-item"><span class="action-icon">◷</span><div class="action-copy"><strong>Die Zukunft gestalten</strong><small>Eine neue Wirtschaftsperiode simulieren</small></div>${mkbutton('+1 Monat','nextMonth','','btn small gold-btn')}</div></div></section>
<section class="panel pad"><div class="section-head"><h2 class="section-title">Marktgeschehen</h2>${mkbutton('Alle Meldungen','navigate','data-id="journal"','btn small')}</div>${recentEvents(4)}</section></div>`;}
function market(){let def=STOCKS.find(x=>x.id===ticker)||STOCKS[0],p=s.stock[def.id],first=p.history[0],change=changePct(first,p.price),positionValue=round(p.shares*p.price),upnl=round(positionValue-p.basis);let metrics=s.companyMetrics[def.id]||def;let feeInfo=s.staff.includes('equity')?'reduzierte Analystengebühren':'Standardgebühren';return title('SEKUNDÄRMARKT · LIVE','Die Börse',`12 fiktive Unternehmen in vier Branchen · ${feeInfo}`)+tutorial()+`<div class="split"><div class="panel"><div class="section-head pad" style="padding-bottom:3px"><h2 class="section-title">Watchlist</h2><span class="mini">${STOCKS.length} Titel</span></div><div class="stock-list">${STOCKS.map(d=>{let x=s.stock[d.id];let prev=x.history.at(-2)||x.price;return `<button class="stock-item ${def.id===d.id?'active':''}" data-action="ticker" data-id="${d.id}"><span class="ticker">${d.id}</span><span style="flex:1"><b>${esc(d.name)}</b><small>${esc(d.sector)}</small></span><span class="stock-price"><b>${money(x.price)}</b><small>${signed(changePct(prev,x.price))}</small></span></button>`}).join('')}</div></div>
<div class="panel pad"><div class="section-head"><div><div class="page-eyebrow">${esc(def.sector)} · ${def.id}</div><h2 style="font-size:25px;margin:0">${esc(def.name)}</h2></div><span class="pill ${change>=0?'green':'red'}">${signed(change)}</span></div><div style="display:flex;align-items:baseline;gap:12px"><strong style="font-size:35px">${money(p.price)}</strong><span class="mini">pro Aktie</span></div><div class="chart-wrapper">${chart(p.history,660,205,change>=0?'#7ee6b9':'#ff9c9f')}</div><div class="chart-axis"><span>VOR ${p.history.length-1} MONATEN</span><span>${getMonthText(s.month)}</span></div><p class="dim">${esc(def.about)}</p><div class="stock-facts"><div class="fact"><small>Umsatz p.a.</small><strong>${money(metrics.revenue*1e6,true)}</strong></div><div class="fact"><small>Gewinn p.a.</small><strong>${money(metrics.profit*1e6,true)}</strong></div><div class="fact"><small>Schulden</small><strong>${money(metrics.debt*1e6,true)}</strong></div><div class="fact"><small>Börsenwert</small><strong>${money(metrics.cap*1e6,true)}</strong></div></div><div class="section-head"><h3 class="section-title">Orderticket</h3><span class="mini">Dividende ${Math.round(def.div*1000)/10} % p.a.</span></div><div class="order-grid"><div class="field"><label for="sharesInput">Stückzahl</label><input id="sharesInput" type="number" min="1" step="1" value="10" inputmode="numeric"></div><div class="order-preview"><span class="mini">Kaufbetrag inkl. Kosten</span><strong id="orderPreview">–</strong></div></div><div class="modal-actions">${mkbutton('↗ Kaufen','buyStock',`data-id="${def.id}"`,'btn teal-btn')}${mkbutton('↙ Verkaufen','sellStock',`data-id="${def.id}" ${!p.shares?'disabled':''}`,'btn')}</div><div class="list-divider"></div><div class="grid-3"><div><span class="mini">BESTAND</span><br><strong>${p.shares} Aktien</strong></div><div><span class="mini">EINSTAND</span><br><strong>${money(p.avg)}</strong></div><div><span class="mini">UNREALISIERT</span><br><strong>${signed(upnl,' €')}</strong></div></div><p class="mini">Kurse sind reine Simulation. Orders haben Spread und Transaktionskosten.</p></div></div>
<div class="panel pad" style="margin-top:18px"><div class="section-head"><h2 class="section-title">Dein Aktiendepot</h2><span class="pill">${money(holdingsValue(s))}</span></div><div class="portfolio-scroll"><table class="portfolio-table"><thead><tr><th>Titel</th><th>Stück</th><th>Einstand</th><th>Kurswert</th><th>Unrealisiert</th><th>Realisiert</th><th></th></tr></thead><tbody>${STOCKS.filter(d=>s.stock[d.id].shares).map(d=>{let p=s.stock[d.id];return `<tr><td><strong>${esc(d.name)}</strong><br><span class="mini">${d.id}</span></td><td>${p.shares}</td><td>${money(p.avg)}</td><td>${money(p.price*p.shares)}</td><td>${signed(round(p.shares*p.price-p.basis),' €')}</td><td>${signed(p.realized,' €')}</td><td>${mkbutton('Öffnen','ticker',`data-id="${d.id}"`,'btn small')}</td></tr>`}).join('')||'<tr><td colspan="7" class="dim">Noch keine Aktien im Depot. Starte mit deinem ersten Kauf.</td></tr>'}</tbody></table></div></div>`;}
const categoryIcon={'Private Equity':'🏢','Private Debt':'📜','Infrastruktur':'⚡','Real Estate':'🏙️'};
function privates(){let filtered=klass==='Alle'?DEALS:DEALS.filter(d=>d.class===klass);return title('PRIVATE CAPITAL · DEALFLOW','Private Markets',`Beteiligungen, Kredite und reale Vermögenswerte · ${DEALS.length} verfügbare Chancen`)+tutorial()+`<div class="chips" style="margin-bottom:20px">${['Alle',...CLASSES].map(c=>`<button class="chip ${klass===c?'active':''}" data-action="filter" data-id="${esc(c)}">${c==='Alle'?'Alle Deals':esc(c)}</button>`).join('')}</div>${s.deals.length?`<section class="panel pad" style="margin-bottom:19px"><div class="section-head"><h2 class="section-title">Aktive Direktinvestments</h2><span class="pill">${s.deals.length} Positionen</span></div><div class="portfolio-scroll"><table class="portfolio-table"><thead><tr><th>Investment</th><th>Typ</th><th>Investiert</th><th>Wert</th><th>Zusagen offen</th><th>Fortschritt</th><th></th></tr></thead><tbody>${s.deals.map(d=>{let x=DEALS.find(y=>y.id===d.id);return `<tr><td><strong>${esc(x.name)}</strong><br><span class="mini">${esc(x.class)}</span></td><td>${esc(x.type)}</td><td>${money(d.paid)}</td><td>${money(d.value)}</td><td>${money(d.remaining)}</td><td>${d.months}/${x.duration} M.</td><td>${mkbutton('Verwalten','openDeal',`data-id="${d.id}"`,'btn small')}</td></tr>`}).join('')}</tbody></table></div></section>`:''}<div class="deal-grid">${filtered.map(d=>{let owned=s.deals.find(x=>x.id===d.id),dd=s.dueDiligence.includes(d.id);return `<article class="deal-card"><div class="section-head"><div class="deal-icon">${categoryIcon[d.class]}</div><span class="pill ${owned?'green':''}">${owned?'IM PORTFOLIO':dd?'ANALYSIERT':'NEUER DEAL'}</span></div><div class="page-eyebrow">${esc(d.class)} · ${esc(d.type)}</div><h3>${esc(d.name)}</h3><p>${esc(d.description)}</p><div class="deal-meta"><span class="pill">${d.duration} MONATE</span><span class="pill">RISIKO ${d.risk}/5</span><span class="pill">ZIEL ${Math.round(d.rate*100)} % p.a.</span></div><div class="deal-footer"><div><small class="mini">KAPITALZUSAGE</small><br><strong>${money(d.commit)}</strong></div>${mkbutton(owned?'Verwalten ↗':'Deal prüfen ↗','openDeal',`data-id="${d.id}"`,'btn small gold-btn')}</div></article>`}).join('')}</div><p class="mini" style="margin-top:13px">Die Renditen sind modellierte Zielgrößen und nicht garantiert. Kapital kann ausfallen oder länger gebunden bleiben.</p>`;}
function company(){let next=OFFICE_UPGRADES[s.office+1];return title('TEAM · IMMOBILIE · STRATEGIE','Deine Investmentgesellschaft',`Baue die Infrastruktur auf, die ${esc(s.company)} für größere Deals braucht.`)+`<div class="two-cols"><section class="panel pad"><div class="section-head"><h2 class="section-title">Standort & Expansion</h2><span class="pill">STUFE ${s.office+1}/4</span></div><div class="kpi-stack"><div class="kpi"><small>AKTUELLES BÜRO</small><b style="font-size:18px">${esc(OFFICE_UPGRADES[s.office].name)}</b><span>Kapazität ${1+s.office*2} Mitarbeitende</span></div><div class="kpi"><small>ANSEHEN</small><b>${s.reputation}/100</b><div class="progress"><span style="width:${s.reputation}%"></span></div></div></div><div class="space"></div>${next?`<div class="info-box">Nächste Stufe: <strong>${esc(next.name)}</strong><br>Investition ${money(next.cost)} · erforderlich ${next.required} Reputation.</div><div class="space"></div>${mkbutton(`Büro ausbauen · ${money(next.cost)}`,'upgrade',s.cash<next.cost||s.reputation<next.required?'disabled':'','btn block gold-btn')}`:'<div class="info-box">Dein Unternehmen verfügt bereits über die höchste Ausbaustufe. Ein echtes Finanzimperium!</div>'}<div class="list-divider"></div><h3 class="section-title">Monatliche Fixkosten</h3><div class="order-preview"><span>Gehälter</span><strong>${money(staffCost(s))}</strong></div><p class="mini">Ist die Liquidität für Gehälter nicht ausreichend, müssen Mitarbeitende das Unternehmen verlassen.</p></section><section class="panel pad"><div class="section-head"><h2 class="section-title">Meilensteine</h2><span class="pill">${Object.keys(s.flags).filter(k=>s.flags[k]).length} ERREICHT</span></div>${milestones()}</section></div><section class="panel pad" style="margin-top:18px"><div class="section-head"><h2 class="section-title">Dein Team</h2><span class="mini">${s.staff.length}/${1+s.office*2} Plätze belegt</span></div><div class="roles-grid">${ROLES.map((r,i)=>{let hired=s.staff.includes(r.id),full=s.staff.length>=1+s.office*2;return `<div class="role-card"><div class="role-avatar">${['📈','🔍','💼','🤝'][i]}</div><div class="details"><strong>${esc(r.name)}</strong><small>${esc(r.description)}</small><small>${money(r.salary)}/Monat · Einstellen ${money(r.fee)}</small></div>${mkbutton(hired?'✓ Im Team':'Einstellen','hire',`data-id="${r.id}" ${hired||full||s.cash<r.fee?'disabled':''}`,'btn small')}</div>`}).join('')}</div></section>`;}
function funds(){let unlocked=s.office>=1&&s.staff.includes('manager')&&s.reputation>=33;return title('FONDSMANAGEMENT · INSTITUTIONELLES KAPITAL','Eigene Investmentfonds','Wirb Anlegerkapital ein, investiere es und verdiene Management Fees – ohne Anlegervermögen zu besitzen.')+`<div class="two-cols"><section class="panel pad"><div class="section-head"><h2 class="section-title">Neuen Fonds auflegen</h2><span class="pill ${unlocked?'green':'red'}">${unlocked?'FREIGESCHALTET':'NOCH GESPERRT'}</span></div>${!unlocked?`<div class="info-box">Voraussetzungen: Investmentboutique, Investmentmanager im Team und mindestens 33 Reputation.</div><div class="space"></div>${mkbutton('Zur Unternehmensentwicklung','navigate','data-id="company"','btn gold-btn')}`:`<form id="fundForm"><div class="field"><label for="fundName">Fondsname (max. 30 Zeichen)</label><input id="fundName" required maxlength="30" value="${esc(s.company)} Fund ${s.funds.length+1}"></div><div class="space"></div><div class="field"><label for="fundClass">Investmentstrategie</label><select id="fundClass">${CLASSES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div><div class="space"></div><button class="btn gold-btn block" type="submit" ${s.cash<12000||s.funds.length>=4?'disabled':''}>Fonds auflegen · 12.000 €</button></form><p class="mini">Die Auflage kostet Gesellschaftskapital. Kapitalzusagen von Investoren sind keine liquiden Mittel der Gesellschaft.</p>`}</section><section class="panel pad"><div class="section-head"><h2 class="section-title">Dein Asset Management</h2><span class="pill">ANLEGERGELDER</span></div><div class="kpi-stack"><div class="kpi"><small>FONDS-AUM</small><b>${money(s.funds.reduce((n,f)=>n+fundNav(f),0),true)}</b><span>Aktueller NAV</span></div><div class="kpi"><small>CAPITAL COMMITMENTS</small><b>${money(s.funds.reduce((n,f)=>n+f.commitment,0),true)}</b><span>Zusagen der Anleger</span></div><div class="kpi"><small>FEES GESAMT</small><b>${money(s.stats.fees,true)}</b><span>Verdiente Managementgebühren</span></div><div class="kpi"><small>FONDS</small><b>${s.funds.length}</b><span>Maximal vier gleichzeitig</span></div></div><p class="mini">Managementgebühr 1,25 % p.a. des NAV; Carry 12 % auf erzielte Wertsteigerungen oberhalb der Hurdle aus investiertem Kapital (vereinfachtes Modell).</p></section></div><section style="margin-top:18px">${s.funds.map(f=>`<div class="fund-card"><div class="section-head"><div><div class="page-eyebrow">${esc(f.class)} · GRÜNDUNG ${getMonthText(f.created)}</div><h2 style="margin:3px 0;font-size:18px">${esc(f.name)}</h2></div><span class="pill green">AKTIV</span></div><div class="fund-grid"><div class="fund-stat"><small>NAV</small><strong>${money(fundNav(f))}</strong></div><div class="fund-stat"><small>KAPITALZUSAGEN</small><strong>${money(f.commitment)}</strong></div><div class="fund-stat"><small>NOCH NICHT ABGERUFEN</small><strong>${money(f.uncalled)}</strong></div><div class="fund-stat"><small>INVESTIERT</small><strong>${money(f.assets)}</strong></div><div class="fund-stat"><small>VERDIENTE FEES</small><strong>${money(f.fees+f.carry)}</strong></div><div class="fund-stat"><small>AUSSCHÜTTUNGEN AN ANLEGER</small><strong>${money(f.distributed)}</strong></div></div><div class="modal-actions">${mkbutton('25 % Kapital abrufen','call',`data-id="${esc(f.id)}" ${f.uncalled<1||f.draws>0&&s.month-f.lastCall<3?'disabled':''}`,'btn teal-btn')}${mkbutton('Anleger ansprechen · 2.300 €','raise',`data-id="${esc(f.id)}" ${s.cash<2300||f.lastRaise!=null&&s.month-f.lastRaise<6?'disabled':''}`)}</div></div>`).join('')||'<div class="panel pad"><p class="dim">Hier erscheinen deine eigenen Investmentfonds. Zuerst braucht dein Unternehmen Reputation, ein größeres Büro und professionelles Fondsmanagement.</p></div>'}</section>`;}
function journal(){return title('GESCHICHTE · TUTORIAL · SIMULATION','Chronik & Leitfaden','Alle wichtigen Marktentscheidungen und ihre wirtschaftlichen Folgen.')+`<div class="two-cols"><section class="panel pad"><div class="section-head"><h2 class="section-title">Chronik</h2><span class="pill">${s.events.length} EINTRÄGE</span></div>${recentEvents(40)}</section><section><div class="panel pad"><h2 class="section-title">So spielst du Capital Empire</h2><p><strong>1. Börse:</strong> Wähle ein Unternehmen, trage eine Stückzahl ein und handle. Achte auf Spread, Gebühren und Konjunktur.</p><p><strong>2. Private Markets:</strong> Prüfe Risiken und Chancen zuerst durch Due Diligence. Nach der Investition können Kapitalabrufe, operative Maßnahmen, Ausschüttungen und Exits folgen.</p><p><strong>3. Unternehmen:</strong> Investiere in Analysten und dein Büro. Beschäftigte erhöhen deine Fähigkeiten, kosten aber monatliche Gehälter.</p><p><strong>4. Fonds:</strong> Wirb Investoren ein, rufe Kapital ab und investiere es. Nur die verdienten Gebühren fließen in dein eigenes Gesellschaftsvermögen.</p><p><strong>5. Zeit:</strong> Drücke ⇥ für den nächsten Monat oder wähle Pause, 1×, 3× oder 10×. Der Zufall wirkt auf alle Märkte durch dieselbe Wirtschaft.</p><div class="info-box">Ziel: Baue aus 250.000 € ein Finanzimperium auf. Hohe Renditen erfordern das Management von Risiko, Liquidität und laufenden Kosten.</div></div><div class="panel pad" style="margin-top:18px"><h2 class="section-title">Kennzahlen</h2><div class="kpi-stack"><div class="kpi"><small>ORDERS</small><b>${s.stats.trades}</b></div><div class="kpi"><small>INVESTMENTEXITS</small><b>${s.stats.exits}</b></div><div class="kpi"><small>DIVIDENDEN</small><b>${money(s.stats.dividends)}</b></div><div class="kpi"><small>FONDS-FEES</small><b>${money(s.stats.fees)}</b></div></div><div class="space"></div>${mkbutton('Spielstand & Einstellungen','settings','','btn block')}</div></section></div>`;}
function updatePreview(){let el=$('orderPreview'),inp=$('sharesInput');if(!el||!inp)return;let q=Number(inp.value),p=s.stock[ticker];if(!Number.isSafeInteger(q)||q<1){el.textContent='Ungültige Stückzahl';return;}let fee=round(Math.max(s.staff.includes('equity')?1:3,q*p.price*(s.staff.includes('equity')?.0008:.0015)));el.textContent=money(round(q*p.price*1.0015+fee));}
function render(){header();navBar();if(unmountOffice){unmountOffice();unmountOffice=null;}const routes={overview,market,private:privates,company,funds,journal};$('screen').innerHTML=routes[screen]();if(screen==='overview')unmountOffice=mountOffice($('officeCanvas'),()=>s);if(screen==='market')updatePreview();}
function showModal(html){$('modalLayer').innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;$('modalLayer').classList.remove('hidden');modal='open';const focus=$('modalLayer').querySelector('input,button');if(focus)focus.focus({preventScroll:true});}
function closeModal(){modal=null;$('modalLayer').classList.add('hidden');$('modalLayer').innerHTML='';}
function showWelcome(){showModal(`<div class="welcome-hero"><strong>CAPITAL EMPIRE</strong><span>DEIN WEG ZUM FINANZIMPERIUM</span></div><div class="page-eyebrow" style="margin-top:19px">DEINE KARRIERE BEGINNT HIER</div><h2>Aus 250.000 € wird dein Imperium.</h2><p>Du gründest eine Investmentgesellschaft. Entscheide über Aktien, Private Equity, Kredite und reale Projekte. Das Risiko gehört dazu – genauso wie dein Erfolg.</p><form id="welcomeForm"><div class="field"><label for="companyInput">Wie soll dein Investmenthaus heißen?</label><input id="companyInput" maxlength="30" value="${esc(s.company)}" autocomplete="off" required></div><div class="space"></div><button type="submit" class="btn block gold-btn">Unternehmen gründen →</button></form><p class="mini">Dein Spielstand wird automatisch lokal gespeichert. Du kannst ihn jederzeit exportieren.</p>`);}
function dealModal(id){let d=DEALS.find(x=>x.id===id);if(!d)return;let own=s.deals.find(x=>x.id===id),dd=s.dueDiligence.includes(id),start=round(d.commit*(d.class==='Private Equity'?.7:d.class==='Infrastruktur'?.6:d.class==='Real Estate'?.8:1));let ddCost=round(Math.max(550,d.commit*(s.staff.includes('private')?.004:.009)));showModal(`<button class="close" data-action="close" aria-label="Schließen">×</button><div class="page-eyebrow">${esc(d.class)} · ${esc(d.type)}</div><h2>${categoryIcon[d.class]} ${esc(d.name)}</h2><p>${esc(d.description)}</p><div class="stock-facts"><div class="fact"><small>Gesamtzusage</small><strong>${money(d.commit)}</strong></div><div class="fact"><small>Erste Einzahlung</small><strong>${money(start)}</strong></div><div class="fact"><small>Laufzeit</small><strong>${d.duration} Monate</strong></div><div class="fact"><small>Risikoklasse</small><strong>${d.risk} / 5</strong></div></div><div class="info-box"><strong>Chancen:</strong> ${esc(d.benefit)}<br><strong>Risiko:</strong> ${dd?esc(d.downside):'Nach Due Diligence detailliert sichtbar.'}<br><strong>Erwartete Rendite:</strong> ca. ${(d.rate*100).toFixed(1)} % p.a. vor tatsächlichen Überraschungen, keine Garantie.</div>${own?`<div class="space"></div><h3>Dein Investment</h3><div class="fund-grid"><div class="fund-stat"><small>Investiert</small><strong>${money(own.paid)}</strong></div><div class="fund-stat"><small>Aktueller Wert</small><strong>${money(own.value)}</strong></div><div class="fund-stat"><small>Kapital offen</small><strong>${money(own.remaining)}</strong></div><div class="fund-stat"><small>Ausschüttungen/Zinsen</small><strong>${money(own.dividends)}</strong></div><div class="fund-stat"><small>Laufzeit</small><strong>${own.months} / ${d.duration}</strong></div><div class="fund-stat"><small>Status</small><strong>${own.defaulted?'Ausfall':esc(own.phase)}</strong></div></div><div class="modal-actions">${own.defaulted?mkbutton('Restrukturieren','restructure',`data-id="${id}"`,'btn teal-btn'):d.class==='Private Debt'?'':mkbutton('Wert verbessern','improve',`data-id="${id}"`,'btn teal-btn')}${mkbutton('Vorzeitig verkaufen','sellDeal',`data-id="${id}"`,'btn danger')}</div><p class="mini">Ein früher Exit ist nur mit einem deutlichen Abschlag möglich (17 % vor Laufzeitende, danach 7 %).</p>`:`<div class="modal-actions">${!dd?mkbutton(`Due Diligence · ${money(ddCost)}`,'dd',`data-id="${id}" ${s.cash<ddCost?'disabled':''}`,'btn teal-btn'):`<span class="pill green">✓ RISIKEN ANALYSIERT</span>`}${mkbutton(`Investieren · ${money(start)}`,'invest',`data-id="${id}" ${!dd||s.cash<start?'disabled':''}`,'btn gold-btn')}</div><p class="mini">Verbindliche Zusage ${money(d.commit)}. Fehlende Folgeabrufe können zu wirtschaftlichen Schäden führen.</p>`}`);}
function settingsModal(){showModal(`<button class="close" data-action="close" aria-label="Schließen">×</button><div class="page-eyebrow">SPIEL & SICHERUNG</div><h2>Einstellungen</h2><p>Dein Spielstand wird nach jeder Entscheidung und jedem Monat gespeichert. Sichere ihn zusätzlich als Datei.</p><div class="action-list"><div class="action-item"><div class="action-icon">◉</div><div class="action-copy"><strong>Soundeffekte</strong><small>${sound?'Aktiviert':'Deaktiviert'}</small></div>${mkbutton(sound?'Ausschalten':'Einschalten','sound','','btn small')}</div><div class="action-item"><div class="action-icon">↓</div><div class="action-copy"><strong>Spielstand exportieren</strong><small>JSON-Sicherungsdatei herunterladen</small></div>${mkbutton('Export','export','','btn small')}</div><div class="action-item"><div class="action-icon">↑</div><div class="action-copy"><strong>Spielstand laden</strong><small>Vorhandene JSON-Datei importieren</small></div><label class="btn small" for="importFile">Import</label><input type="file" id="importFile" accept=".json,application/json" hidden></div><div class="action-item"><div class="action-icon">↻</div><div class="action-copy"><strong>Neues Spiel</strong><small>Bestehenden Fortschritt zurücksetzen</small></div>${mkbutton('Neustart','reset','', 'btn small danger')}</div></div><p class="mini">Version ${VERSION} · Offline-fähiges Browser-Spiel · Ausschließlich simulierte Märkte.</p>${mkbutton('Zurück zum Spiel','close','','btn block')}`);}
function confirmModal(text,yes,code){showModal(`<button class="close" data-action="close">×</button><div class="page-eyebrow">BESTÄTIGUNG</div><h2>${esc(text)}</h2><p>Diese Entscheidung kann finanzielle Folgen haben oder vorhandene Daten überschreiben.</p><div class="modal-actions">${mkbutton('Abbrechen','close')}${mkbutton(esc(yes),code,'','btn danger')}</div>`);}
let last=performance.now(),accum=0;
function tick(t){let delta=Math.min(2000,t-last);last=t;if(s.started&&speed>0){accum+=delta;let interval=SPEED_INTERVAL[speed];let turns=0;while(accum>=interval&&turns<5){advanceMonth(s);accum-=interval;turns++;}if(turns){save();render();}}requestAnimationFrame(tick);}requestAnimationFrame(tick);
document.addEventListener('input',e=>{if(e.target.id==='sharesInput')updatePreview();});
document.addEventListener('submit',e=>{if(!['welcomeForm','fundForm'].includes(e.target.id))return;e.preventDefault();if(e.target.id==='welcomeForm'){s.company=safeName($('companyInput').value);s.started=true;s.seenIntro=true;save();closeModal();nav('overview');showToast(`Willkommen bei ${s.company}! Deine ersten 250.000 € stehen bereit.`);}else{let name=$('fundName').value,klass=$('fundClass').value;let f=run(()=>createFund(s,name,klass));if(f)showToast('Fonds aufgelegt. Rufe jetzt Kapital von Investoren ab.');}});
document.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;try{let file=e.target.files[0];if(!file)return;if(file.size>4000000)throw Error('Datei ist zu groß.');let data=validate(JSON.parse(await file.text()));s=data;save();closeModal();render();showToast('Spielstand wiederhergestellt.');}catch(err){showToast('Import fehlgeschlagen: '+err.message,true);}});
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,id=el.dataset.id;switch(a){case 'navigate':closeModal();nav(id);break;case 'ticker':ticker=id;render();break;case 'filter':klass=id;render();break;case 'nextMonth':run(()=>advanceMonth(s));break;case 'settings':settingsModal();break;case 'close':closeModal();break;case 'sound':sound=!sound;settingsModal();break;case 'export':{let b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='capital-empire-spielstand.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),6000);showToast('Spielstand exportiert.');break;}case 'reset':confirmModal('Wirklich von vorne anfangen?','Spiel neu starten','resetConfirm');break;case 'resetConfirm':s=initialState();screen='overview';save();showWelcome();render();break;case 'buyStock':{let qty=Number($('sharesInput')?.value);let value=run(()=>buy(s,id,qty));if(value!=null)showToast(`Aktien gekauft: ${money(value)}`);break;}case 'sellStock':{let qty=Number($('sharesInput')?.value);let value=run(()=>sell(s,id,qty));if(value!=null)showToast(`Aktien verkauft: ${money(value)}`);break;}case 'openDeal':dealModal(id);break;case 'dd':{let ret=run(()=>dueDiligence(s,id));if(ret!=null){dealModal(id);showToast('Due Diligence abgeschlossen. Risiken jetzt sichtbar.');}break;}case 'invest':{let ret=run(()=>invest(s,id));if(ret){dealModal(id);showToast('Investiert! Behalte zukünftige Kapitalabrufe im Auge.');}break;}case 'improve':{let ret=run(()=>improveDeal(s,id));if(ret!=null){dealModal(id);showToast('Operative Maßnahme umgesetzt.');}break;}case 'restructure':{let ret=run(()=>restructure(s,id));if(ret!=null){dealModal(id);showToast('Kredit restrukturiert.');}break;}case 'sellDeal':{activeLayer=id;confirmModal('Investment mit Abschlag verkaufen?','Jetzt verkaufen','sellDealConfirm');break;}case 'sellDealConfirm':{let ret=run(()=>exitDeal(s,activeLayer,true));if(ret!=null){closeModal();showToast(`Exit erfolgreich: ${money(ret)} erhalten.`);}break;}case 'hire':{let ret=run(()=>hire(s,id));if(ret!==null)showToast('Neues Teammitglied eingestellt.');break;}case 'upgrade':{let ret=run(()=>upgrade(s));if(ret!==null)showToast('Dein Unternehmen hat einen neuen Standort!');break;}case 'call':{let ret=run(()=>callCapital(s,id));if(ret!=null)showToast(`Kapitalabruf: ${money(ret)} investiert.`);break;}case 'raise':{let ret=run(()=>approachInvestors(s,id));if(ret!=null)showToast(`${money(ret)} Anlegerzusagen gewonnen.`);break;}}});
document.querySelectorAll('.speed').forEach(e=>e.addEventListener('click',()=>{speed=Number(e.dataset.speed);accum=0;header();showToast(speed===0?'Spiel pausiert.':`Spiel läuft mit ${speed}× Geschwindigkeit.`);}));
$('nextMonth').dataset.action='nextMonth';$('settingsBtn').dataset.action='settings';
$('modalLayer').addEventListener('click',e=>{if(e.target===$('modalLayer'))closeModal();});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal();if(e.key===' '&&e.target===document.body){e.preventDefault();speed=speed?0:1;accum=0;header();}});
render();if(!s.started)showWelcome();if(saveError)showToast(`Vorheriger Spielstand konnte nicht geladen werden: ${saveError}`,true);

</script>
</body>
</html>
